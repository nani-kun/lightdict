<!doctype html>
<!--
  宣传图：?size=small 出 440×280，?size=marquee 出 1400×560。
  商店建议「缩到一半也要看得清」，所以只放图标、名字和一句话，不堆截图。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>LightDict 宣传图</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* body 不给高度的话，弹性居中没有参照物，渐变也只铺满内容那一小条、
       剩下的靠平铺补齐——出来就是内容贴顶、背景带三道横杠。 */
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: radial-gradient(120% 140% at 18% 0%, #4f46e5 0%, #3730a3 42%, #1e1b4b 100%);
      background-repeat: no-repeat;
      color: #fff;
    }
    .wrap { display: flex; align-items: center; gap: var(--gap); padding: 0 var(--pad); }
    img { width: var(--icon); height: var(--icon); flex: none;
          filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); }
    .name { font-size: var(--name); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .tag { margin-top: var(--tagtop); font-size: var(--tag); line-height: 1.45; color: #c7d2fe; }

    body[data-size="small"]   { --gap: 20px; --pad: 30px; --icon: 76px;  --name: 30px; --tag: 14px; --tagtop: 6px; }
    body[data-size="marquee"] { --gap: 48px; --pad: 90px; --icon: 190px; --name: 74px; --tag: 27px; --tagtop: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- shots/ 是 make_store_assets.sh 临时生成的 512 图标，拍完即删；
       单独打开本文件时这里会是空的，那是预期 -->
    <img src="shots/icon512.png" alt="" />
    <div>
      <div class="name">LightDict 轻词典</div>
      <div class="tag" id="tag"></div>
    </div>
  </div>
  <script>
    const size = new URLSearchParams(location.search).get('size') === 'marquee' ? 'marquee' : 'small';
    document.body.dataset.size = size;
    document.getElementById('tag').textContent =
      size === 'marquee' ? '划词即查　整页对照　零依赖，不打扰' : '划词即查 · 整页对照';
  </script>
</body>
</html>
