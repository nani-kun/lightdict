<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>LightDict</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">LD</span>
      <span class="name">LightDict</span>
    </div>
    <label class="switch" title="启用划词"><input type="checkbox" id="enabled" /><i></i></label>
  </header>

  <div class="tip" id="tip">选中英文单词或句子，停留片刻即可查询。</div>

  <!-- 手动查词：不用先在页面上划词，直接输入中英文查释义或译文 -->
  <section class="ask">
    <div class="ask-box">
      <input type="text" id="q" placeholder="输入中英文，回车查词或翻译"
        autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
      <button class="ask-go" id="qGo">查询</button>
    </div>
    <div class="ask-out" id="qOut" hidden></div>
  </section>

  <section class="page">
    <button class="page-btn" id="pageBtn">
      <span class="page-mark">译</span>
      <b id="pageLabel">整页翻译</b>
    </button>
    <!-- 括号里的快捷键由 popup.js 按浏览器里登记的那个补上（macOS 上是 ⌥T） -->
    <p class="page-note" id="pageNote">自动识别语言，译成简体中文对照</p>
  </section>

  <section class="book">
    <div class="book-head">
      <h2>生词本 <em id="count">0</em></h2>
      <div class="tools">
        <button class="link" id="export">导出</button>
        <button class="link" id="clear">清空</button>
      </div>
    </div>
    <input type="search" id="search" placeholder="搜索生词…" />
    <ul id="list"></ul>
    <p class="empty" id="empty">还没有收藏的单词。<br />在卡片上点 ☆ 即可加入。</p>
  </section>

  <footer>
    <button class="link" id="options">打开设置</button>
  </footer>

  <!-- 挑嗓音的规则和卡片、设置页共用一份；它是普通脚本，得排在模块前面 -->
  <script src="../common/voices.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
